# Raw Workers AI input uses `reasoning_effort = low|medium|high` and
# `chat_template_kwargs.thinking = true|false`.
# https://developers.cloudflare.com/workers-ai/models/kimi-k2.6/sync-input.json (accessed 2026-06-25)
name = "Kimi K2.6"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi-k2"
release_date = "2026-04-20"
last_updated = "2026-04-20"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-01"
open_weights = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.6
output = 3
cache_read = 0.16

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image"]
output = ["text"]
